<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Shield Badge with Heart and Checkmark -->
  <g filter="url(#shadow)">
    <path d="M12 12 C12 12, 28 8, 34 8 C40 8, 56 12, 56 12 C56 34, 38 48, 34 52 C30 48, 12 34, 12 12 Z" fill="url(#shieldGrad)" />
    <!-- Inner heart shape -->
    <path d="M34 22 C31.5 18.5 26 18.5 23.5 22.5 C20 28 29 33.5 34 38.5 C39 33.5 48 28 44.5 22.5 C42 18.5 36.5 18.5 34 22 Z" fill="#ffffff" opacity="0.95" />
    <!-- Checkmark -->
    <path d="M29 29.5 L33 33.5 L40 25.5" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Brand Name -->
  <text x="68" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.8">Safe<tspan fill="#2563eb">Life</tspan></text>
  <text x="70" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#059669" letter-spacing="2">INSURANCE SIMPLIFIED</text>
</svg>
